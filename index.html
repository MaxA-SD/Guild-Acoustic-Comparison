<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guild Acoustic Comparison</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --text: #1d1b18; --muted: #6f6a62;
    --line: #dcd7cd; --accent: #b4532a; --accent-text: #ffffff; --btn-muted: #e6e2d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #1f1d1b; --text: #ece8e1; --muted: #9a948a;
      --line: #36322d; --accent: #e07a4a; --accent-text: #151413; --btn-muted: #2e2b27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h2 { font-size: 1.1rem; margin: 0; }
  .status { color: var(--muted); font-size: .85rem; min-height: 1.2em; margin: 4px 0 10px; }
  .status.err { color: #c0392b; }
  .master { display: flex; gap: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--text); padding: 6px 14px;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  li .play, li .stop {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; flex: none; font-size: 1rem;
    background: var(--btn-muted); border-color: var(--btn-muted); color: var(--muted);
  }
  li.active .play { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  li .stop { border-radius: 8px; }
  li .label { overflow-wrap: anywhere; flex: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Guild Acoustic Comparison</h1>
    <p class="sub">Click any play button to start. Click another during playback to switch instantly at the same position. Spacebar starts and stops.</p>
  </header>
  <div id="cats" style="display:contents"></div>
</main>

<script>
// ---- Configuration --------------------------------------------------------
// Files are loaded from  audio/<Category>/<filename>.wav  (labels = filenames).
// "trim" is a per-file linear gain, reserved for a future level-matching feature.
const CATEGORIES = {
  Strum: [
    "Hifi DNA - Strum",
    "Hifi DNA (Tone Down) - Strum",
    "Session VTC - Strum",
    "Session VTC (Tone Down) - Strum",
    "Wavelength - Strum",
    "Wavelength Mic Half - Strum",
    "Wavelength Mic Full - Strum"
  ],
  Fingerpick: [
    "Hifi DNA - Fingerpick",
    "Hifi DNA (Tone Down) - Fingerpick",
    "Session VTC - Fingerpick",
    "Session VTC (Tone Down) 0- Fingerpick",
    "Wavelength - Fingerpick",
    "Wavelength Mic Half - Fingerpick",
    "Wavelength Mic Full - Fingerpick"
  ]
};
// Display-label fixes only (the real filename on disk is unchanged).
const LABEL_OVERRIDES = {
  "Session VTC (Tone Down) 0- Fingerpick": "Session VTC (Tone Down) - Fingerpick"
};
const SWITCH_TC = 0.002;   // gain time constant (s) -> ~5-10 ms click-free crossfade

// ---- Audio engine ---------------------------------------------------------
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const state = {};          // per category
let activeCat = null;      // only one category plays at a time
let last = { cat: Object.keys(CATEGORIES)[0], idx: 0 };   // what spacebar starts

function buildUI() {
  const root = document.getElementById("cats");
  for (const [cat, names] of Object.entries(CATEGORIES)) {
    const s = state[cat] = {
      name: cat, files: names.map(n => ({ name: n, label: LABEL_OVERRIDES[n] || n, buffer: null, trim: 1, normGain: 1 })),
      L: 0, loop: false, norm: false, playing: false, active: null,
      sources: [], gains: [], trims: [], t0: 0, raf: 0, loaded: 0, els: {}
    };
    const sec = document.createElement("section");
    sec.innerHTML = `
      <div class="head">
        <h2>${cat}</h2>
        <div class="master">
          <button class="toggle" data-act="loop" aria-pressed="false">Loop</button>
          <button class="toggle" data-act="norm" aria-pressed="false" title="Peak-normalize each file to 0 dBFS">Normalize</button>
        </div>
      </div>
      <p class="status">Loading…</p>
      <div class="bar"><div></div></div>
      <ul></ul>`;
    const ul = sec.querySelector("ul");
    s.files.forEach((f, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "play"; btn.textContent = "▶"; btn.disabled = true;
      btn.setAttribute("aria-label", "Play " + f.label);
      btn.onclick = () => play(cat, i);
      const lab = document.createElement("span");
      lab.className = "label"; lab.textContent = f.label;
      const stp = document.createElement("button");
      stp.className = "stop"; stp.textContent = "■"; stp.disabled = true;
      stp.setAttribute("aria-label", "Stop " + cat);
      stp.onclick = () => stop(cat);
      li.append(btn, stp, lab); ul.append(li);
      f.li = li; f.btn = btn; f.stopBtn = stp;
    });
    s.els = {
      status: sec.querySelector(".status"),
      bar: sec.querySelector(".bar > div"),
      loop: sec.querySelector('[data-act="loop"]'),
      norm: sec.querySelector('[data-act="norm"]')
    };
    s.els.loop.onclick = () => setLoop(cat, !s.loop);
    s.els.norm.onclick = () => setNorm(cat, !s.norm);
    root.append(sec);
  }
}

function peakOf(buf) {
  let peak = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const a = d[i] < 0 ? -d[i] : d[i]; if (a > peak) peak = a; }
  }
  return peak;
}

function trimFor(s, f) { return f.trim * (s.norm ? f.normGain : 1); }

async function loadCategory(cat) {
  const s = state[cat];
  try {
    await Promise.all(s.files.map(async f => {
      const url = encodeURI(`audio/${cat}/${f.name}.wav`);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} for ${url}`);
      f.buffer = await ctx.decodeAudioData(await res.arrayBuffer());
      f.normGain = 1 / (peakOf(f.buffer) || 1);   // gain that brings the file's peak to 0 dBFS
      s.els.status.textContent = `Loading… ${++s.loaded}/${s.files.length}`;
    }));
    // Shared length = shortest file, so every file wraps/ends together.
    s.L = Math.min(...s.files.map(f => f.buffer.duration));
    s.files.forEach(f => f.btn.disabled = false);
    s.els.status.textContent = `${s.files.length} files ready · ${s.L.toFixed(1)} s`;
  } catch (e) {
    s.els.status.textContent = "Load failed: " + e.message +
      " (serve over http(s), e.g. GitHub Pages; file:// won't work)";
    s.els.status.classList.add("err");
  }
}

function play(cat, idx) {
  const s = state[cat];
  last = { cat, idx };
  if (s.playing) {                         // already running: just switch
    if (s.active !== idx) switchTo(s, idx);
    return;
  }
  if (activeCat && activeCat !== cat) stop(activeCat);
  ctx.resume();
  const t0 = ctx.currentTime + 0.05;       // start all files on one shared clock
  s.sources = []; s.gains = []; s.trims = [];
  s.files.forEach((f, i) => {
    const src = ctx.createBufferSource();
    src.buffer = f.buffer;
    src.loop = s.loop; src.loopStart = 0; src.loopEnd = s.L;
    const trim = ctx.createGain(); trim.gain.value = trimFor(s, f);
    const g = ctx.createGain(); g.gain.value = i === idx ? 1 : 0;
    src.connect(trim).connect(g).connect(ctx.destination);
    src.start(t0, 0);
    s.sources.push(src); s.gains.push(g); s.trims.push(trim);
  });
  s.t0 = t0; s.playing = true; s.active = idx; activeCat = cat;
  refresh(s);
  s.raf = requestAnimationFrame(() => tick(s));
}

function switchTo(s, idx) {
  const now = ctx.currentTime;
  s.gains.forEach((g, i) => {
    g.gain.cancelScheduledValues(now);
    g.gain.setTargetAtTime(i === idx ? 1 : 0, now, SWITCH_TC);
  });
  s.active = idx; refresh(s);
}

function stop(cat) {
  const s = state[cat];
  cancelAnimationFrame(s.raf);
  s.sources.forEach(src => { try { src.stop(); } catch (_) {} src.disconnect(); });
  s.gains.forEach(g => g.disconnect());
  s.trims.forEach(t => t.disconnect());
  s.sources = []; s.gains = []; s.trims = [];
  s.playing = false; s.active = null;
  if (activeCat === cat) activeCat = null;
  s.els.bar.style.width = "0%";
  refresh(s);
}

function setLoop(cat, on) {
  const s = state[cat];
  if (s.playing) {
    const now = ctx.currentTime;
    if (!on) s.t0 = now - (Math.max(0, now - s.t0) % s.L);   // re-anchor to current loop position
    s.sources.forEach(src => { src.loop = on; });
  }
  s.loop = on;
  s.els.loop.setAttribute("aria-pressed", String(on));
}

function setNorm(cat, on) {
  const s = state[cat];
  s.norm = on;
  s.els.norm.setAttribute("aria-pressed", String(on));
  if (s.playing) {
    const now = ctx.currentTime;
    s.trims.forEach((t, i) => {
      t.gain.cancelScheduledValues(now);
      t.gain.setTargetAtTime(trimFor(s, s.files[i]), now, 0.005);
    });
  }
}

function tick(s) {
  if (!s.playing) return;
  const elapsed = Math.max(0, ctx.currentTime - s.t0);
  if (!s.loop && elapsed >= s.L) { stop(s.name); return; }
  const pos = s.loop ? elapsed % s.L : elapsed;
  s.els.bar.style.width = (pos / s.L * 100).toFixed(2) + "%";
  s.raf = requestAnimationFrame(() => tick(s));
}

function refresh(s) {
  s.files.forEach((f, i) => {
    const on = s.playing && s.active === i;
    f.li.classList.toggle("active", on);
    f.stopBtn.disabled = !s.playing;
  });
}

// Spacebar: stop whatever is playing, otherwise start the last-used file.
function spaceHandler(e) {
  if (e.code !== "Space") return;
  e.preventDefault();                       // no page scroll / no re-click of a focused button
  if (e.type !== "keydown" || e.repeat) return;
  if (activeCat) stop(activeCat);
  else if (state[last.cat].files[last.idx].buffer) play(last.cat, last.idx);
}
document.addEventListener("keydown", spaceHandler);
document.addEventListener("keyup", spaceHandler);

buildUI();
Object.keys(CATEGORIES).forEach(loadCategory);
</script>
</body>
</html>
